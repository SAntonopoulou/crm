name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly soak: the claim concurrency test at 100 iterations.
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
          POSTGRES_DB: crm
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://crm:crm@localhost:5432/crm
      REDIS_URL: redis://localhost:6379
      KEYCLOAK_ISSUER: http://localhost:8082/realms/crm
      SUPPRESSION_HMAC_KEY: ci-only-suppression-key
      # Nightly runs soak the atomic claim; PRs run 10 iterations.
      CLAIM_SOAK: ${{ github.event_name == 'schedule' && '100' || '10' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run migrate up
      - name: Migration rollback round-trip (top migration)
        run: npm run migrate down && npm run migrate up
      - name: Kysely codegen drift check
        run: |
          npm run codegen
          git diff --exit-code src/shared/database/db.d.ts \
            || (echo "::error::generated DB types drifted from migrations — run npm run codegen and commit" && exit 1)
      - run: npm run build
      - name: Tests (mandated scenarios are unskippable — no .skip in specs)
        run: |
          ! grep -rn "\.skip(\|\.only(" test/ && npm test

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Validate OpenAPI documents
        run: npx --yes @redocly/cli@latest lint api/openapi/crm-v1.yaml api/openapi/ingest-v1.yaml
      - name: Breaking-change gate (PRs touching the contract)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          for spec in crm-v1 ingest-v1; do
            if ! git diff --quiet origin/${{ github.base_ref }} -- api/openapi/$spec.yaml; then
              git show origin/${{ github.base_ref }}:api/openapi/$spec.yaml > /tmp/base-$spec.yaml
              npx --yes oasdiff breaking /tmp/base-$spec.yaml api/openapi/$spec.yaml \
                --fail-on ERR \
                || (echo "::error::breaking change in $spec without a version bump — see api/README.md change policy" && exit 1)
            fi
          done
